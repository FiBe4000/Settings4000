# Continuous-integration gate for Settings4000 (task 1.4, requirement R6.1).
#
# The `gate` job runs the project's three mandatory checks — formatting,
# lints-as-errors, and the test suite — as separate steps in one job. GitHub
# Actions fails a job as soon as any step exits non-zero, so the run fails if
# *any* of the three gates fails, which is exactly the acceptance criterion for
# task 1.4.
#
# The `arch-package` job (tasks 12.3 and 12.5, requirement R8.7) builds both
# Arch Linux packages on Arch itself — the VCS package in
# packaging/arch/settings4000-git/ and the release package in
# packaging/arch/settings4000/ — so a PKGBUILD that no longer builds, a stale
# .SRCINFO, or a namcap error turns the run red. On a release tag it also
# checks that the tag names the version in Cargo.toml. The jobs are independent
# and run in parallel.
name: CI

# Gate every push to the default branch and every pull request. This is the
# authoritative pre-merge check; the optional local hook in `.githooks/`
# mirrors it for faster feedback before pushing. Pushing a release tag
# (`v<version>`, see docs/releasing.md) runs the same checks on the tagged
# commit, plus the tag/version check in `arch-package`.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least-privilege token: both jobs only read the repository to build and test
# it, so drop the default broader `GITHUB_TOKEN` scope to read-only. This limits
# the blast radius if a step (or a third-party action) were ever compromised.
permissions:
  contents: read

# A newer commit on the same branch/PR makes an in-flight run obsolete, so
# cancel it to save CI minutes and return the latest result faster.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install GTK 4 development libraries
        # The `gtk4` crate links against the system GTK 4 through pkg-config, so
        # the headers and `.pc` files must be present before any cargo step can
        # compile the crate. `libgtk-4-dev` pulls in the glib/cairo/pango/gdk
        # dev packages transitively, so it is the only package we need to name.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-4-dev

      - name: Install the Rust toolchain with rustfmt and clippy
        # `dtolnay/rust-toolchain` is the de-facto standard action for this; the
        # `@stable` ref selects the current stable channel and the components are
        # required by the fmt and clippy gates below.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, index, and build outputs
        # Keyed on the toolchain and Cargo.lock, so a green run only reuses
        # artifacts that are still valid. Purely a speed optimisation — it never
        # affects whether a gate passes or fails.
        uses: Swatinem/rust-cache@v2

      # The three gates, one step each. Kept as three distinct steps (rather
      # than one combined script) so the failing gate is obvious at a glance in
      # the run summary. Per CLAUDE.md the canonical gate is
      # `cargo fmt --check` / `cargo clippy -D warnings` / `cargo test`.
      - name: Formatting gate — cargo fmt --check
        run: cargo fmt --all --check

      - name: Lint gate — cargo clippy -D warnings
        # `--all-targets` extends the documented gate to lint tests and any
        # future examples/benches as well, so lints in test code are caught too;
        # `-D warnings` promotes every warning to an error (R6.1).
        run: cargo clippy --all-targets -- -D warnings

      - name: Test gate — cargo test
        run: cargo test

  arch-package:
    name: Arch package (${{ matrix.package }})
    runs-on: ubuntu-latest
    # makepkg, pacman and namcap only exist on Arch Linux, and the package must
    # be built against Arch's own gtk4 and Rust, so the job runs inside the
    # official Arch image on the Ubuntu runner. Every `run:` step below executes
    # in that container, as root.
    container: archlinux:latest
    strategy:
      # Each package is built in its own run of this job. They share every
      # step; only the directory, the built package's name and the source of
      # the build (see the makepkg step) differ. fail-fast is off so a failure
      # in one package does not cancel the other's build, whose result is
      # still worth seeing.
      fail-fast: false
      matrix:
        package: [settings4000-git, settings4000]
    env:
      # The package name, passed to the scripts through the environment rather
      # than expanded into their text by the workflow engine.
      PACKAGE: ${{ matrix.package }}
    defaults:
      run:
        # Fail on the first failing command, on a failure anywhere in a
        # pipeline (the .SRCINFO check pipes makepkg into diff), and on an
        # unset variable. GitHub's `shell: bash` is the same without `-u`; it
        # is spelled out because the steps rely on all three.
        shell: bash --noprofile --norc -euo pipefail {0}
        working-directory: packaging/arch/${{ matrix.package }}
    steps:
      - name: Install the build tools
        # Must run before the checkout: the Arch image ships without git, and
        # actions/checkout falls back to downloading a tarball through the
        # REST API when git is missing — that tree has no .git directory, so
        # makepkg could not clone it and pkgver() could not count commits.
        # `-Syu` rather than `-Sy`: Arch supports only full upgrades, and the
        # image may lag behind the repositories. `rust` is named here because
        # both `rust` and `rustup` provide the PKGBUILD's `cargo` makedepend
        # and pacman's choice between them is not guaranteed; with `rust`
        # installed, the later `--needed` install of `cargo` is already
        # satisfied. The package's own dependencies are installed in a later
        # step, read from the PKGBUILD.
        working-directory: /
        run: pacman -Syu --noconfirm --needed base-devel git namcap rust

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The full history, not the default single commit: pkgver() appends
          # `git rev-list --count HEAD`, which a shallow clone would report as 1,
          # and makepkg's clone of this checkout would be shallow as well.
          fetch-depth: 0

      - name: Check that the release tag matches the version
        # Only on a tag push. A release tag `v<version>` must name exactly the
        # version in Cargo.toml (read with the same sed as the -git package's
        # pkgver()) and in the release package's `pkgver=`; otherwise the tag
        # was put on the wrong commit or the version bump is incomplete. The
        # unit tests already keep Cargo.toml and `pkgver=` equal to each other,
        # so this step mainly guards the tag itself.
        if: github.ref_type == 'tag'
        working-directory: .
        run: |
          tag_version=${GITHUB_REF_NAME#v}
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          pkgbuild_version=$(sed -n 's/^pkgver=//p' packaging/arch/settings4000/PKGBUILD)
          printf 'tag %s, Cargo.toml %s, release PKGBUILD %s\n' \
            "$GITHUB_REF_NAME" "$cargo_version" "$pkgbuild_version"
          if [[ $tag_version != "$cargo_version" || $tag_version != "$pkgbuild_version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $cargo_version in Cargo.toml and $pkgbuild_version in the release PKGBUILD"
            exit 1
          fi

      - name: Create the unprivileged build user
        # makepkg refuses to run as root (it would let a PKGBUILD's package()
        # write anywhere on the system), so it runs as `builder` through
        # runuser, which keeps the working directory and resets HOME to the
        # user's own home for cargo. Owning the checkout lets makepkg create its
        # src/, pkg/ and clone directories and rewrite the PKGBUILD's `pkgver=`
        # line, and it also satisfies git's ownership check (`safe.directory`)
        # when makepkg clones the checkout as that user — the checkout itself
        # is created as root, which actions/checkout already allows for its own
        # git commands.
        working-directory: /
        run: |
          useradd --create-home builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Install the package's dependencies from the PKGBUILD
        # The list comes from the PKGBUILD itself — makepkg's own parser prints
        # every `depends`, `makedepends` and `checkdepends` entry — so a
        # dependency added there is installed here without editing this file.
        # They are installed up front so a plain `makepkg` finds them all and
        # never needs `-s` (which would call sudo). `cargo` is already
        # satisfied by the `rust` package installed in the first step.
        # Versioned entries (`foo>=1`) pass through to pacman unchanged, which
        # accepts them; should an entry with `<` ever be added, this sed is the
        # place to strip the version constraint.
        run: |
          mapfile -t deps < <(runuser -u builder -- makepkg --printsrcinfo |
            sed -n -E 's/^\t(depends|makedepends|checkdepends) = //p')
          printf 'Installing: %s\n' "${deps[*]}"
          pacman -S --noconfirm --needed "${deps[@]}"

      # The checks below run in this order on purpose: a build of the -git
      # package rewrites the PKGBUILD's `pkgver=0` placeholder with the
      # computed version, so the .SRCINFO comparison and the PKGBUILD lint must
      # see the committed file and therefore run before the build.
      - name: Check that .SRCINFO matches the PKGBUILD
        # .SRCINFO is generated by `makepkg --printsrcinfo` and committed beside
        # the PKGBUILD; diff exits non-zero and prints the difference when
        # someone changed the PKGBUILD without regenerating it.
        run: runuser -u builder -- makepkg --printsrcinfo | diff -u .SRCINFO -

      - name: Lint the PKGBUILD with namcap
        # namcap exits 0 even when it reports problems, so its output is
        # searched instead: any error (`E:`) or warning (`W:`) line fails the
        # step. Informational notes are not printed without `-i`.
        run: |
          namcap PKGBUILD | tee namcap-pkgbuild.log
          if grep -E ' [EW]: ' namcap-pkgbuild.log; then
            echo '::error::namcap reported the problems above in the PKGBUILD'
            exit 1
          fi

      - name: Build and test the package with makepkg
        # The full build, including check() and therefore the whole test suite.
        #
        # -git package: `_repo` points the git source at this checkout instead
        # of GitHub, so the commit under test is the one built, not the tip of
        # main (the PKGBUILD header documents the override). makepkg mirrors
        # the repository and builds its HEAD; on pull requests
        # actions/checkout leaves a detached HEAD at the merge commit, and that
        # clone simply checks out the same detached commit, so pkgver() still
        # works.
        #
        # Release package: it has no such override and clones the tag
        # `v<pkgver>` from GitHub, exactly as a user's build does, so this
        # proves the published release builds. The tag must therefore already
        # be on GitHub whenever this runs — on a `main` push too, not only on
        # the tag push. That is why a release commit (which changes `pkgver=`)
        # and its tag are pushed together in one `git push --follow-tags`
        # (docs/releasing.md): pushed without its tag, or before the first tag
        # existed, the release commit fails here. A pull request that bumps
        # the version fails here for the same reason, so releases are made on
        # `main` directly.
        run: |
          build_env=()
          if [[ $PACKAGE == *-git ]]; then
            build_env=(_repo="file://$GITHUB_WORKSPACE")
          fi
          runuser -u builder -- env "${build_env[@]}" makepkg --noconfirm

      - name: Lint the built package with namcap
        # Arch's default makepkg.conf also produces a `-debug` package of
        # detached symbols; the glob skips it (pkgver starts with a digit),
        # and exactly one main package must exist. As for the PKGBUILD, every
        # `E:`/`W:` line fails the step, with one accepted exception: namcap
        # reports the dynamic loader as an unused shared library in every Rust
        # binary, because Rust links it explicitly and nothing references a
        # symbol from it. That is a known false positive, not a packaging bug.
        # Because both `archlinux:latest` and namcap float, a new namcap
        # release can turn this step (or the PKGBUILD lint) red with no change
        # in the repository. That is accepted: the new finding is either fixed
        # or, if it is a false positive, added to the allow-list below.
        run: |
          shopt -s nullglob
          packages=("$PACKAGE"-[0-9]*.pkg.tar.zst)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::expected one built package, found: ${packages[*]:-none}"
            exit 1
          fi
          namcap "${packages[0]}" | tee namcap-package.log
          if grep -E ' [EW]: ' namcap-package.log |
            grep -vF "W: Unused shared library '/usr/lib64/ld-linux-x86-64.so.2'"; then
            echo '::error::namcap reported the problems above in the built package'
            exit 1
          fi

      - name: List the package contents and check the installed files
        # The listing is printed for the log; the check fails if any of the four
        # artifacts the package exists to install (binary, desktop entry, icon,
        # license; see package() in the PKGBUILD) is missing. The package is
        # selected exactly as in the namcap step, so this step stands on its
        # own rather than relying on that step's check.
        run: |
          shopt -s nullglob
          packages=("$PACKAGE"-[0-9]*.pkg.tar.zst)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::expected one built package, found: ${packages[*]:-none}"
            exit 1
          fi
          package=${packages[0]}
          tar -tvf "$package"
          contents=$(tar -tf "$package")
          status=0
          for file in \
            usr/bin/settings4000 \
            usr/share/applications/org.settings4000.Settings4000.desktop \
            usr/share/icons/hicolor/scalable/apps/org.settings4000.Settings4000.svg \
            "usr/share/licenses/$PACKAGE/LICENSE"; do
            if ! grep -qxF "$file" <<<"$contents"; then
              echo "::error::$package does not contain $file"
              status=1
            fi
          done
          exit "$status"
