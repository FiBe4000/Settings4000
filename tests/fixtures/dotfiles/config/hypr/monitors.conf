# Dynamic monitor configuration
# Known monitors use desc: rules (stable across DP port changes)
# Unknown monitors fall through to the catchall

# Catchall — any unrecognized monitor gets native resolution, auto-placed
monitor=,preferred,auto,1

# Built-in laptop panel (eDP-1). The hotplug script disables it when docked and
# re-enables it undocked. Per-machine settings are keyed on the panel's EDID
# desc — a later matching rule overrides the generic eDP-1 rule above it, so
# each laptop only picks up its own line. This file is the SINGLE SOURCE for
# eDP mode/scale: scripts/hypr-display-profile.sh parses the matching monitor=
# line below (eDP-1 for laptop A, the desc rule for laptop B) to
# derive EDP_MODE/EDP_SCALE/EDP_EXTRA/EDP_DPI for hotplug and toggle. Edit here.
#
# NOTE: Hyprland no longer reads this file natively — hyprland.lua parses it and
# issues hl.monitor() per line, in file order. Two parsers (Lua + the awk in
# hypr-display-profile.sh) depend on the format, so it is FROZEN as:
#   monitor=<output>,<mode>,<position>,<scale>[,<key>,<value>...]
# No commas inside desc: values.

# Laptop A — 2880x1800 120Hz 10-bit panel, 1.333x (default for eDP-1)
monitor=eDP-1,2880x1800@120,auto,1.333333,bitdepth,10

# Laptop B — 2560x1440 panel keyed on its EDID desc, at scale 1 (native). If you
# ever want it larger, 1.066667 (2400x1350 logical) is the only blur-free step
# between 1 and 1.25: the fractional-scale protocol quantizes to 1/120, and
# 128/120 is the sole clean divisor in that range.
monitor=desc:Example Panel Vendor 0x2036,2560x1440,auto,1

# Office — dual external 1440p setup. Both panels only advertise
# 2560x1440@59.95Hz at this resolution (Hyprland snaps @60 to that), so the @60
# pin changes nothing; it just makes the rate explicit. Pinned 2026-09-14 while
# chasing black screens on re-dock.
monitor=desc:Example Monitor Corp QHD-24 0x0001,2560x1440@60,0x0,1
monitor=desc:Example Monitor Corp QHD-24 0x0002,2560x1440@60,2560x0,1

# Home — external monitors. Modes are pinned because the 27G EDID misreports
# its preferred mode (falls to 1680x1050 via the catchall); it tops out at
# 2560x1440@59.95Hz (Hyprland snaps @60 to that).
# NOTE: the 27T advertises 144Hz but goes BLACK at 1440p@144 through the home
# dock — the modeset "succeeds" (hyprctl reports 144, dpms on) yet the link
# can't sustain it. @120 tested stable 2026-08-17; do NOT raise to @144.
monitor=desc:Example Home Display 27G 0x0003,2560x1440@60,-2560x0,1
monitor=desc:Example Home Display 27T 0x0004,2560x1440@120,0x0,1
